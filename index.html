<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDMU Digital Library Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass-effect w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden border border-gray-200">
        
        <div class="p-8 border-b border-gray-100 text-center">
            <div class="flex justify-center items-center mb-4">
                <div class="w-10 h-10 bg-blue-700 rounded-lg flex items-center justify-center text-white font-bold mr-3">T</div>
                <h1 class="text-2xl font-bold text-blue-800 tracking-tight">THƯ VIỆN SỐ TDMU</h1>
            </div>
            <p class="text-sm font-medium text-gray-400 uppercase tracking-widest">Bước 2 của 3</p>
            <div class="mt-4 w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                <div class="bg-blue-600 h-full w-2/3"></div>
            </div>
        </div>

        <div class="p-10">
            <h2 class="text-3xl font-bold text-gray-800 text-center mb-10">Đăng ký tài khoản</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-2">Mã sinh viên</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">👤</span>
                            <input type="text" placeholder="Nhập mã số sinh viên" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-2">Họ tên</label>
                        <input type="text" placeholder="Nguyễn Văn A" class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-2">Email trường</label>
                        <input type="email" placeholder="example@tdmu.edu.vn" class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-2">Số điện thoại</label>
                        <input type="tel" placeholder="0901xxxxxx" class="w-full px-4 py-3 rounded-xl border border-gray-300 outline-none">
                    </div>
                </div>

                <div class="flex flex-col items-center justify-center border-2 border-dashed border-blue-200 rounded-2xl bg-blue-50/50 p-6">
                    <p class="text-blue-700 font-semibold mb-4">Chụp ảnh khuôn mặt</p>
                    <div class="relative w-48 h-48 rounded-full border-4 border-white shadow-lg overflow-hidden bg-gray-200 flex items-center justify-center">
                        <div class="text-4xl">📷</div>
                        <div class="absolute top-0 left-0 w-full h-1 bg-blue-500 opacity-50 animate-bounce"></div>
                    </div>
                    <button class="mt-6 px-6 py-2 bg-blue-100 text-blue-700 rounded-full text-sm font-bold hover:bg-blue-200 transition-colors">
                        Mở Camera
                    </button>
                </div>
            </div>

            <div class="mt-12 text-center">
                <button class="w-full md:w-1/2 bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1">
                    TIẾP TỤC ĐĂNG KÝ
                </button>
                <p class="mt-4 text-gray-400 text-sm">Bằng cách nhấn tiếp tục, bạn đồng ý với điều khoản sử dụng của thư viện.</p>
            </div>
        </div>
    </div>

</body>
</html>
