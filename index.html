<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDMU Library - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; }
        .tdmu-blue { background-color: #00468B; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="p-8 text-center border-b border-slate-50">
            <div class="w-16 h-16 tdmu-blue rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg shadow-blue-900/20">T</div>
            <h1 class="text-2xl font-bold text-slate-800 uppercase tracking-tight">Đăng nhập Thư viện</h1>
            <p class="text-slate-400 text-sm mt-1">Chọn phương thức xác thực của bạn</p>
        </div>

        <div class="p-8">
            <div class="flex bg-slate-100 p-1 rounded-xl mb-8">
                <button onclick="switchTab('pwd')" id="btn-pwd" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow-sm text-blue-800">Mật khẩu</button>
                <button onclick="switchTab('face')" id="btn-face" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500">Khuôn mặt</button>
            </div>

            <div id="tab-pwd" class="space-y-4">
                <input type="text" placeholder="Mã sinh viên" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" placeholder="Mật khẩu" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                <button class="w-full tdmu-blue text-white font-bold py-4 rounded-xl shadow-lg">VÀO HỆ THỐNG</button>
            </div>

            <div id="tab-face" class="hidden flex flex-col items-center">
                <div class="w-48 h-48 rounded-2xl bg-slate-900 overflow-hidden relative mb-6">
                    <div class="absolute inset-0 border-2 border-blue-500/50 rounded-2xl"></div>
                    <div class="absolute top-1/2 left-0 w-full h-0.5 bg-blue-500 shadow-[0_0_10px_blue] animate-pulse"></div>
                </div>
                <p class="text-xs text-slate-400 mb-6 italic">Hệ thống đang trích xuất Face Embedding...</p>
                <button class="w-full border-2 border-[#00468B] text-[#00468B] font-bold py-3 rounded-xl hover:bg-blue-50">BẬT CAMERA</button>
            </div>

            <div class="mt-8 text-center">
                <a href="register.html" class="text-sm text-slate-400 hover:text-blue-700">Chưa có tài khoản? <span class="font-bold text-blue-600 underline">Đăng ký ngay</span></a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const pwdTab = document.getElementById('tab-pwd');
            const faceTab = document.getElementById('tab-face');
            const btnPwd = document.getElementById('btn-pwd');
            const btnFace = document.getElementById('btn-face');

            if(type === 'pwd') {
                pwdTab.classList.remove('hidden');
                faceTab.classList.add('hidden');
                btnPwd.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow-sm text-blue-800';
                btnFace.className = 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500';
            } else {
                pwdTab.classList.add('hidden');
                faceTab.classList.remove('hidden');
                btnFace.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow-sm text-blue-800';
                btnPwd.className = 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500';
            }
        }
    </script>
</body>
</html>
