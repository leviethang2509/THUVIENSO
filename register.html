<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDMU Library - Đăng ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; }
        .tdmu-blue { background-color: #00468B; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <div class="flex items-center">
                <div class="w-10 h-10 tdmu-blue rounded-lg flex items-center justify-center text-white font-bold mr-3">T</div>
                <h1 class="text-xl font-bold text-[#00468B]">THƯ VIỆN SỐ TDMU</h1>
            </div>
            <a href="login.html" class="text-sm font-semibold text-blue-600 hover:underline">Đã có tài khoản? Đăng nhập</a>
        </div>

        <div class="p-10">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800">Đăng ký tài khoản mới</h2>
                <p class="text-slate-500">Bước 2: Hoàn thiện thông tin & Xác thực khuôn mặt</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div class="space-y-5">
                    <input type="text" placeholder="Mã sinh viên" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" placeholder="Họ và tên" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none">
                    <input type="email" placeholder="Email trường (@tdmu.edu.vn)" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none">
                    <input type="tel" placeholder="Số điện thoại" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none">
                </div>

                <div class="bg-blue-50/50 border-2 border-dashed border-blue-200 rounded-3xl p-8 flex flex-col items-center justify-center text-center">
                    <p class="text-blue-700 font-bold mb-4">Chụp ảnh khuôn mặt (Face ID)</p>
                    <div class="relative w-44 h-44 rounded-full border-4 border-white shadow-xl bg-slate-300 overflow-hidden flex items-center justify-center">
                        <span class="text-5xl opacity-30">👤</span>
                        <div class="absolute top-0 left-0 w-full h-1 bg-blue-600 animate-bounce opacity-40"></div>
                    </div>
                    <button class="mt-6 bg-white text-blue-700 px-6 py-2 rounded-full text-sm font-bold shadow-sm border border-blue-100">Mở Camera</button>
                </div>
            </div>

            <div class="mt-12 text-center">
                <button class="w-full md:w-1/2 tdmu-blue text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition-all uppercase tracking-widest">Hoàn tất đăng ký</button>
                <p class="mt-4 text-xs text-slate-400">Hệ thống sẽ gửi email xác nhận kích hoạt sau khi lưu thành công.</p>
            </div>
        </div>
    </div>
</body>
</html>
